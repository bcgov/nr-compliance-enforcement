scalar DateTime

type Party {
  partyIdentifier: String
  partyTypeCode: String
  longDescription: String
  shortDescription: String
  createdDateTime: DateTime
  updatedDateTime: DateTime
  createdByUserGuid: String
  person: Person
  business: Business
  addresses: [Address]
  contactMethods: [ContactMethod]
  aliases: [Alias]
  externalIds: [PartyExternalId]
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  totalCount: Int!
  totalPages: Int!
  currentPage: Int!
  pageSize: Int!
}

type PartyResult {
  items: [Party!]!
  pageInfo: PageInfo!
}

input PartyCreateInput {
  partyTypeCode: String!
  longDescription: String
  shortDescription: String
  person: PersonInput
  business: BusinessInput
  addresses: [AddressInput]
  contactMethods: [ContactMethodInput]
  aliases: [AliasInput]
  externalIds: [PartyExternalIdInput]
}

input PartyUpdateInput {
  partyTypeCode: String!
  longDescription: String
  shortDescription: String
  person: PersonUpdateInput
  business: BusinessUpdateInput
  addresses: [AddressUpdateInput]
  contactMethods: [ContactMethodInput]
  aliases: [AliasUpdateInput]
  externalIds: [PartyExternalIdUpdateInput]
  images: [ImageUpdateInput]
}

input ImageUpdateInput {
  fileName: String!
  verb: String!
}

input PartyFilters {
  search: String
  partyTypeCode: String
  sortBy: String
  sortOrder: String
}

type PartyMatchedField {
  field: String!
  exact: Boolean!
  points: Int!
}

type PartyMatchResult {
  party: Party!
  score: Int!
  matchedFields: [PartyMatchedField!]!
}

input PartyUniqueFieldCheckInput {
  driversLicenseNumber: String
  driversLicenseCountryCode: String
  driversLicenseCountrySubdivisionCode: String
  businessIdentifierValue: String
  externalIds: [PartyExternalIdInput!]
}

# A unique identifier that is already in use by a published profile
type PartyUniqueFieldConflict {
  fieldCode: String!
  shortDescription: String!
  value: String!
}

# Distinct input type as shared parties currently have mandatory fields.  Could combine in future.
input PartyMatchInput {
  partyTypeCode: String!
  person: PersonMatchInput
  business: BusinessMatchInput
  aliases: [AliasMatchInput!]
  addresses: [AddressMatchInput!]
  contactMethods: [ContactMethodMatchInput!]
  externalIds: [PartyExternalIdMatchInput!]
}

# Party history reads bypass RLS, so these types only expose what the compliance history should show.
type PartyHistoryInvestigation {
  investigationGuid: String
  description: String
  leadAgency: String
  investigationStatus: InvestigationStatusCode
  openedTimestamp: DateTime
  updatedTimestamp: DateTime
  locationGeometry: Point
  locationAddress: String
  locationDescription: String
  name: String
  supervisorGuid: String
  primaryInvestigatorGuid: String
  contraventions: [PartyHistoryContravention]
}

type PartyHistoryContravention {
  contraventionIdentifier: String!
  legislationIdentifierRef: String!
  investigationParty: [PartyHistoryContraventionParty]
  date: DateTime
}

type PartyHistoryContraventionParty {
  partyReference: String
  enforcementActions: [PartyHistoryEnforcementAction]
}

type PartyHistoryEnforcementAction {
  enforcementActionIdentifier: String!
  enforcementActionCode: EnforcementActionCode!
  ticket: PartyHistoryTicket
}

type PartyHistoryTicket {
  ticketOutcomeCode: String!
}

type PartyHistoryInspection {
  inspectionGuid: String
  description: String
  leadAgency: String
  inspectionStatus: InspectionStatusCode
  openedTimestamp: DateTime
  updatedTimestamp: DateTime
  name: String
  locationGeometry: Point
  locationAddress: String
  locationDescription: String
}

type PartyHistoryCaseFile {
  caseIdentifier: String
  leadAgency: AgencyCode
  name: String
  activities: [PartyHistoryCaseActivity]
}

type PartyHistoryCaseActivity {
  activityIdentifier: String
}
