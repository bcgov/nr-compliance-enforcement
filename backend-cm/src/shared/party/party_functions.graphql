type Query {
  party(partyIdentifier: String!): Party
  searchParties(page: Int = 1, pageSize: Int = 25, filters: PartyFilters): PartyResult!
  partyHistoryInvestigations(partyId: String!, partyType: String!): [PartyHistoryInvestigation]
  partyHistoryInspections(partyId: String!, partyType: String!): [PartyHistoryInspection]
  partyHistoryCaseFiles(partyId: String!, partyType: String!): [PartyHistoryCaseFile]
  matchParty(input: PartyMatchInput!): [PartyMatchResult!]!
  checkPartyUniqueFields(input: PartyUniqueFieldCheckInput!, excludePartyIdentifier: String): [PartyUniqueFieldConflict!]!
}

type Mutation {
  createParty(input: PartyCreateInput!): Party!
  updateParty(partyIdentifier: String!, input: PartyUpdateInput!): Party!
}
