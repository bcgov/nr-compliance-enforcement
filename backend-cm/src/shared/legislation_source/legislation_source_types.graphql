type LegislationSource {
  legislationSourceGuid: String!
  shortDescription: String!
  longDescription: String
  sourceUrl: String
  regulationsSourceUrl: String
  agencyCode: String!
  sourceType: String!
  activeInd: Boolean!
  parentLegislationSourceGuid: String
  externalKey: String
  animalInformationDisplayType: AnimalInformationDisplayType!
  createUserId: String
  createUtcTimestamp: String
}

input CreateLegislationSourceInput {
  shortDescription: String!
  longDescription: String
  sourceUrl: String!
  regulationsSourceUrl: String
  agencyCode: String!
  sourceType: String
  effectiveDate: String
  animalInformationDisplayType: AnimalInformationDisplayType
}

input UpdateLegislationSourceInput {
  legislationSourceGuid: String!
  shortDescription: String
  longDescription: String
  sourceUrl: String
  regulationsSourceUrl: String
  agencyCode: String
  activeInd: Boolean
  animalInformationDisplayType: AnimalInformationDisplayType
}

enum AnimalInformationDisplayType {
  "Mandatory: always visible and required."
  M
  "Optional: visible but not required."
  O
  "Hidden: not visible."
  H
}
