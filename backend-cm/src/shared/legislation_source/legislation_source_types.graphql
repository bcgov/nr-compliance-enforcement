type LegislationSource {
  legislationSourceGuid: String!
  shortDescription: String!
  longDescription: String
  sourceUrl: String
  regulationsSourceUrl: String
  agencyCode: String!
  sourceType: String!
  activeInd: Boolean!
  parentLegislationSourceGuid: String
