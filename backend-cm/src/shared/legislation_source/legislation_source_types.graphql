  shortDescription: String!
  longDescription: String
  sourceUrl: String!
  regulationsSourceUrl: String
  agencyCode: String!
  sourceType: String
  effectiveDate: String
}

input UpdateLegislationSourceInput {
  legislationSourceGuid: String!
  shortDescription: String
  longDescription: String
  sourceUrl: String
  regulationsSourceUrl: String
  agencyCode: String
  activeInd: Boolean
}
