---
version: "3.8"

x-var:
  - &POSTGRES_USER postgres
  - &POSTGRES_PASSWORD default
  - &COMPLAINT_PASSWORD default
  - &COMPLAINT_OUTCOME_PASSWORD default2
  - &INS_PASSWORD default3
  - &INV_PASSWORD default4
  - &SHARED_PASSWORD default5
  - &METABASE_READONLY_PASSWORD default6

x-postgres-vars: &postgres-vars
  POSTGRES_USER: *POSTGRES_USER
  POSTGRES_PASSWORD: *POSTGRES_PASSWORD
  COMPLAINT_PASSWORD: *COMPLAINT_PASSWORD
  COMPLAINT_OUTCOME_PASSWORD: *COMPLAINT_OUTCOME_PASSWORD
  INS_PASSWORD: *INS_PASSWORD
  INV_PASSWORD: *INV_PASSWORD
  SHARED_PASSWORD: *SHARED_PASSWORD
  METABASE_READONLY_PASSWORD: *METABASE_READONLY_PASSWORD
services:
  database:
    build:
      context: database
    container_name: database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: default
      POSTGRES_DB: postgres
    hostname: database
    restart: always
    user: postgres
    # Parallel query workers allocate shared memory beyond Docker's 64MB default
    shm_size: 1gb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 15s
      timeout: 5s
      retries: 3
    volumes:
      - /pgdata
  migration-complaint:
    image: flyway/flyway@sha256:4118b764c2ae51e980a94d0e43fde0ed2ad273abe641ce43d03f62da7f7fb6f9
    container_name: migration-complaint
    command:
      - info
      - migrate
      - -outOfOrder=true
    volumes:
      - "./migration-complaint/migrations:/flyway/sql"
      - "./migration-complaint/test-only-migrations:/flyway/sql-test"
      - "./migration-complaint/baseline:/flyway/baseline"
    environment:
      FLYWAY_URL: jdbc:postgresql://database:5432/postgres?currentSchema=complaint,public
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: default
      FLYWAY_PLACEHOLDERS_COMPLAINT_PASSWORD: *COMPLAINT_PASSWORD
      FLYWAY_BASELINE_ON_MIGRATE: true
      FLYWAY_DEFAULT_SCHEMA: complaint
      FLYWAY_LOCATIONS: filesystem:./sql, filesystem:./sql-test, filesystem:./baseline
    depends_on:
      database:
        condition: service_healthy
      migration-shared:
        condition: service_completed_successfully
  migration-investigation:
    image: flyway/flyway@sha256:4118b764c2ae51e980a94d0e43fde0ed2ad273abe641ce43d03f62da7f7fb6f9
    container_name: migration-investigation
    command:
      - info
      - migrate
      - -outOfOrder=true
    volumes:
      - "./migration-investigation/migrations:/flyway/sql"
      - "./migration-investigation/test-only-migrations:/flyway/sql-test"
      - "./migration-investigation/baseline:/flyway/baseline"
    environment:
      FLYWAY_URL: jdbc:postgresql://database:5432/postgres?currentSchema=investigation,public
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: default
      FLYWAY_PLACEHOLDERS_INVESTIGATION_PASSWORD: *INV_PASSWORD
      FLYWAY_BASELINE_ON_MIGRATE: true
      FLYWAY_DEFAULT_SCHEMA: investigation
      FLYWAY_LOCATIONS: filesystem:./sql, filesystem:./sql-test, filesystem:./baseline
    depends_on:
      database:
        condition: service_healthy
      migration-shared:
        condition: service_completed_successfully
  migration-inspection:
    image: flyway/flyway@sha256:4118b764c2ae51e980a94d0e43fde0ed2ad273abe641ce43d03f62da7f7fb6f9
    container_name: migration-inspection
    command:
      - info
      - migrate
      - -outOfOrder=true
    volumes:
      - "./migration-inspection/migrations:/flyway/sql"
      - "./migration-inspection/test-only-migrations:/flyway/sql-test"
      - "./migration-inspection/baseline:/flyway/baseline"
    environment:
      FLYWAY_URL: jdbc:postgresql://database:5432/postgres?currentSchema=inspection,public
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: default
      FLYWAY_PLACEHOLDERS_INSPECTION_PASSWORD: *INS_PASSWORD
      FLYWAY_BASELINE_ON_MIGRATE: true
      FLYWAY_DEFAULT_SCHEMA: inspection
      FLYWAY_LOCATIONS: filesystem:./sql, filesystem:./sql-test, filesystem:./baseline
    depends_on:
      database:
        condition: service_healthy
      migration-shared:
        condition: service_completed_successfully
  migration-shared:
    image: flyway/flyway@sha256:4118b764c2ae51e980a94d0e43fde0ed2ad273abe641ce43d03f62da7f7fb6f9
    container_name: migration-shared
    command:
      - info
      - migrate
      - -outOfOrder=true
    volumes:
      - "./migration-shared/migrations:/flyway/sql"
      - "./migration-shared/test-only-migrations:/flyway/sql-test"
      - "./migration-shared/baseline:/flyway/baseline"
    environment:
      FLYWAY_URL: jdbc:postgresql://database:5432/postgres?currentSchema=shared,public
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: default
      FLYWAY_BASELINE_ON_MIGRATE: true
      FLYWAY_PLACEHOLDERS_SHARED_PASSWORD: *SHARED_PASSWORD
      FLYWAY_DEFAULT_SCHEMA: shared
      FLYWAY_LOCATIONS: filesystem:./sql, filesystem:./sql-test, filesystem:./baseline
      FLYWAY_PLACEHOLDERS_METABASE_READONLY_PASSWORD: *METABASE_READONLY_PASSWORD
    depends_on:
      database:
        condition: service_healthy
  migration-complaint-outcome:
    image: flyway/flyway@sha256:4118b764c2ae51e980a94d0e43fde0ed2ad273abe641ce43d03f62da7f7fb6f9
    container_name: migration-complaint-outcome
    command:
      - info
      - migrate
      - -outOfOrder=true
    volumes:
      - "./migration-complaint-outcome/migrations:/flyway/sql"
      - "./migration-complaint-outcome/test-only-migrations:/flyway/sql-test"
      - "./migration-complaint-outcome/baseline:/flyway/baseline"
    environment:
      FLYWAY_URL: jdbc:postgresql://database:5432/postgres?currentSchema=complaint_outcome,public
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: default
      FLYWAY_BASELINE_ON_MIGRATE: true
      FLYWAY_PLACEHOLDERS_COMPLAINT_OUTCOME_PASSWORD: *COMPLAINT_OUTCOME_PASSWORD
      FLYWAY_DEFAULT_SCHEMA: complaint_outcome
      FLYWAY_LOCATIONS: filesystem:./sql, filesystem:./sql-test, filesystem:./baseline
    depends_on:
      database:
        condition: service_healthy
      migration-shared:
        condition: service_completed_successfully
  backend:
    container_name: backend
    entrypoint:
      - "sh"
      - "-c"
      - "npm i && npm run start:dev"
    environment:
      NODE_ENV: development
      # Windows/WSL2 bind mounts don't emit inotify events into the container so --watch sees nothing, these switch to polling
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    hostname: backend
    # automapper v9 needs node >= 20.19 for require(esm)
    image: node@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392
    links:
      - database
    ports:
      - "3001:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    user: root
    working_dir: "/app"
    depends_on:
      database:
        condition: service_healthy
      migration-complaint:
        condition: service_started
  frontend:
    container_name: frontend
    entrypoint: sh docker-entrypoint.sh
    environment:
      NODE_ENV: development
      PORT: "3000"
      VITE_API_URL: http://localhost:3001/api
      VITE_ENVIRONMENT_NAME: DEVELOPMENT
      CODEGEN_GRAPHQL_URL: http://backend-cm:3000/graphql
    hostname: frontend
    image: node@sha256:0e5f906573693feaa1e21057ebdcfdb5bd5021f050b2dc7c9deceb629c7da2a8
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    links:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    user: root
    working_dir: "/app"
  nats:
    image: nats:latest # Using the latest official NATS image
    command:
      - "-js"
      - "-DVV"
    ports:
      - "4222:4222" # Default NATS client port
      - "8222:8222" # NATS monitoring port
    environment:
      - NATS_USER=natsuser # this is just for the developer instance of nats
      - NATS_PASSWORD=natspass # this is just for the developer instance of nats
  webeoc:
    container_name: webeoc
    entrypoint:
      - "sh"
      - "-c"
      - "npm i && npm run start:dev"
    hostname: webeoc
    image: node@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392
    links:
      - nats
    ports:
      - "3002:3000"
    volumes:
      - ./webeoc:/app
      - webeoc_node_modules:/app/node_modules
      - ./webeoc/logs:/mnt/data # this is just for the developer webeoc logging
    user: root
    working_dir: "/app"
  backend-cm:
    container_name: backend-cm
    entrypoint: sh -c "apt-get update && \
      apt-get install -y --no-install-recommends openssl=3.0.22-1~deb12u1 libssl3=3.0.22-1~deb12u1 && \
      rm -rf /var/lib/apt/lists/* && \
      npm i && npm run prisma-generate-complaint-outcome && \
      npm run prisma-generate-shared && \
      npm run prisma-generate-investigation && \
      npm run prisma-generate-inspection && \
      npm run start:dev"
    environment:
      <<: *postgres-vars
      NODE_ENV: development
      BACKEND_PORT: "3000"
      NATS_HOST: nats://nats:4222
      # Windows/WSL2 bind mounts don't emit inotify events into the container so --watch sees nothing, these switch to polling
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    image: node@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392
    ports: ["3003:3000"]
    volumes: ["./backend-cm:/app", "backend_cm_node_modules:/app/node_modules"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api"]
    working_dir: "/app"
    depends_on:
      migration-complaint-outcome:
        condition: service_completed_successfully
      migration-inspection:
        condition: service_completed_successfully
      migration-investigation:
        condition: service_completed_successfully
      migration-shared:
        condition: service_completed_successfully
      nats:
        condition: service_started
  event-worker:
    container_name: event-worker
    entrypoint:
      - "sh"
      - "-c"
      - "npm i && npm run start:dev"
    environment:
      # Windows/WSL2 bind mounts don't emit inotify events into the container so --watch sees nothing, these switch to polling
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    hostname: event-worker
    image: node@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392
    links:
      - nats
    ports:
      - "3006:3000"
    volumes:
      - ./event-worker:/app
      - event_worker_node_modules:/app/node_modules
    user: root
    working_dir: "/app"
# named volumes to cache install files between container restarts
volumes:
  frontend_node_modules:
  backend_node_modules:
  backend_cm_node_modules:
  webeoc_node_modules:
  event_worker_node_modules:
