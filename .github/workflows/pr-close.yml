name: PR Closed

on:
  pull_request:
    types: [closed]

concurrency:
  # PR open and close use the same group, allowing only one at a time
  group: ${{ github.event.number }}
  cancel-in-progress: true

env:
  GITOPS_REPO_BRANCH: CE-2645 # TESTING ONLY: revert to main before merge
  GITOPS_REPO: bcgov-c/tenant-gitops-f208ae
  GITOPS_REPO_VALUES_PATH: ./charts/apps/natsuite/values
  GITOPS_REPO_OUTPUTS_PATH: ./charts/apps/natsuite/values/.outputs

jobs:
  ### Emerald Jobs ###
  cleanup-emerald:
    name: Cleanup Ephemeral Emerald Developer Environments
    runs-on: ubuntu-22.04
    steps:
      - name: Get GitOps repo token
        id: gitops-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: bcgov-c
          repositories: tenant-gitops-f208ae

      - name: Checkout CD repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ steps.gitops-token.outputs.token }}
          ref: ${{ env.GITOPS_REPO_BRANCH }}

      - name: Calculate Deployment Number
        id: get-deployment-number
        shell: bash
        run: |
          PR_NUMBER=$(echo ${{ github.event.number }})
          PR_NUMBER_MOD_TEN=$(($PR_NUMBER % 10))
          echo "DEPLOYMENT_NUMBER=$(($PR_NUMBER_MOD_TEN))" >> $GITHUB_OUTPUT

      - name: Get PR Creation timestamp
        id: get-pr-creation-timestamp
        shell: bash
        run: |
          created="${{ github.event.pull_request.created_at }}"
          formatted=$(date -d "$created" +"%Y%m%d-%H%M%S")
          echo "PR_CREATION_TIMESTAMP=$formatted" >> "$GITHUB_OUTPUT"

      - name: Configure git
        # From https://github.com/orgs/community/discussions/26560#discussioncomment-3531273
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Tag base with merged PR
        # The next test release uses this PR's build. Tagging base here instead of
        # promoting out of the PR means 10+ open PRs since the last release can't
        # promote an invalid build number.
        #
        # Infra changes made on the dev branch reach base through a reviewed PR in the
        # gitops repo, never automatically.
        #
        # Scoped to PRs targeting main: hotfix PRs against release/** must NOT shift
        # the dev/test base — they're shaping prod, not the next test release.
        if: ${{ github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' }}
        run: |
          VALUES_DIR="${{ env.GITOPS_REPO_VALUES_PATH }}" \
          OUTPUTS_DIR="${{ env.GITOPS_REPO_OUTPUTS_PATH }}" \
          ./.github/scripts/gitops.sh tag base ${{ github.event.number }} ${{ github.event.pull_request.head.sha }}

      - name: Release dev environment
        # Points the slot's argoapp back at main, which tears the env down and frees the
        # slot. Only swaps if this PR's branch still holds it. Runs even if tagging failed,
        # so a closed PR can never leave its slot held.
        if: ${{ !cancelled() }}
        run: |
          DEPLOYMENT_NUMBER=${{ steps.get-deployment-number.outputs.DEPLOYMENT_NUMBER }}
          PR_CREATION_TIMESTAMP=${{ steps.get-pr-creation-timestamp.outputs.PR_CREATION_TIMESTAMP }}
          ./.github/scripts/gitops.sh unreserve dev-$DEPLOYMENT_NUMBER dev-$DEPLOYMENT_NUMBER-$PR_CREATION_TIMESTAMP

      - name: Commit and push update
        if: ${{ !cancelled() }}
        run: |
          DEPLOYMENT_NUMBER=${{ steps.get-deployment-number.outputs.DEPLOYMENT_NUMBER }}
          ./.github/scripts/gitops.sh commitall "Releasing dev-$DEPLOYMENT_NUMBER for PR ${{ github.event.number }}"
          git push origin ${{ env.GITOPS_REPO_BRANCH }}
